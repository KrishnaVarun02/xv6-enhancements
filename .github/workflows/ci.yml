name: xv6 guest tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  guest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cpus: [1, 3]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-system-misc
      - run: make -j4 TOOLPREFIX=riscv64-linux-gnu- kernel/kernel fs.img
      - run: python3 tests/qemu_test.py --cpus ${{ matrix.cpus }}
      - if: matrix.cpus == 1
        run: python3 tests/qemu_test.py --cpus 1 --command schedtest --expect 'SCHEDULER TEST PASSED'
